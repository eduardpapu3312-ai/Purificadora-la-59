<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Purificadora la 59</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @media (max-height: 500px) { .bottom-nav { display: none; } }
        /* Animaciones personalizadas */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in-up { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-100 pb-20">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const loadData = (key, defaultValue) => {
                const saved = localStorage.getItem(key);
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) { return defaultValue; }
                }
                return defaultValue;
            };

            const [tasaDolar, setTasaDolar] = useState(() => loadData('tasaDolar', 36.5));
            const [tasaInput, setTasaInput] = useState(tasaDolar);
            const [seccionActual, setSeccionActual] = useState('ventas');
            const [fechaFiltro, setFechaFiltro] = useState(new Date().toISOString().split('T')[0]);
            
            const [ventas, setVentas] = useState(() => loadData('ventas', []));
            const [inventario, setInventario] = useState(() => loadData('inventario', []));
            const [debemos, setDebemos] = useState(() => loadData('debemos', []));
            const [nosDeben, setNosDeben] = useState(() => loadData('nosDeben', []));
            
            const [preciosRapidos, setPreciosRapidos] = useState(() => loadData('preciosRapidos', [
                { id: 1, nombre: 'Botellón Grande', precioBs: 300 },
                { id: 2, nombre: 'Botellón Mediano', precioBs: 150 }
            ]));

            useEffect(() => { localStorage.setItem('tasaDolar', JSON.stringify(tasaDolar)); }, [tasaDolar]);
            useEffect(() => { localStorage.setItem('ventas', JSON.stringify(ventas)); }, [ventas]);
            useEffect(() => { localStorage.setItem('inventario', JSON.stringify(inventario)); }, [inventario]);
            useEffect(() => { localStorage.setItem('debemos', JSON.stringify(debemos)); }, [debemos]);
            useEffect(() => { localStorage.setItem('nosDeben', JSON.stringify(nosDeben)); }, [nosDeben]);
            useEffect(() => { localStorage.setItem('preciosRapidos', JSON.stringify(preciosRapidos)); }, [preciosRapidos]);

            const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, mensaje: '', onConfirm: null });
            const [modalAbierto, setModalAbierto] = useState(false);
            const [alerta, setAlerta] = useState('');

            const [tasaVisible, setTasaVisible] = useState(false);
            const [modoVenta, setModoVenta] = useState('manual');
            
            // Estado para el mes mostrado en el calendario de Profit
            const [fechaCalendario, setFechaCalendario] = useState(new Date());

            const mostrarAlerta = (msg) => {
                setAlerta(msg);
                setTimeout(() => setAlerta(''), 3000);
            };

            const confirmarAccion = (mensaje, accion) => {
                setConfirmDialog({ isOpen: true, mensaje, onConfirm: accion });
            };

            const guardarTasa = () => {
                setTasaDolar(parseFloat(tasaInput));
                mostrarAlerta('Tasa actualizada correctamente');
            };

            const obtenerFechaHora = () => new Date().toLocaleString('es-VE', { dateStyle: 'short', timeStyle: 'short' });
            const obtenerFechaCorta = () => new Date().toISOString().split('T')[0];

            const procesarVenta = (nombre, precioBs, cantidad = 1, esDelInventario = false, idProd = null) => {
                const totalBs = parseFloat(precioBs) * cantidad;
                const nuevaVenta = {
                    id: Date.now(),
                    nombre: cantidad > 1 ? `${cantidad}x ${nombre}` : nombre,
                    precioBs: totalBs,
                    fechaHora: obtenerFechaHora(),
                    fechaCorta: obtenerFechaCorta(),
                    esDelInventario,
                    idProducto: idProd,
                    cantidadVendida: cantidad
                };

                if (esDelInventario && idProd) {
                    const producto = inventario.find(i => i.id === idProd);
                    if (!producto || producto.cantidad < cantidad) {
                        mostrarAlerta('Error: Stock insuficiente');
                        return;
                    }
                    setInventario(inventario.map(item => 
                        item.id === idProd ? { ...item, cantidad: item.cantidad - cantidad } : item
                    ));
                }

                setVentas([nuevaVenta, ...ventas]);
                setModalAbierto(false);
                mostrarAlerta('Venta registrada exitosamente');
            };

            const eliminarVenta = (venta) => {
                confirmarAccion(`¿Eliminar la venta de "${venta.nombre}"? Si es del inventario, se devolverán los productos.`, () => {
                    if (venta.esDelInventario && venta.idProducto) {
                        setInventario(inventario.map(item => 
                            item.id === venta.idProducto ? { ...item, cantidad: item.cantidad + venta.cantidadVendida } : item
                        ));
                    }
                    setVentas(ventas.filter(v => v.id !== venta.id));
                    setConfirmDialog({ isOpen: false });
                    mostrarAlerta('Venta eliminada');
                });
            };

            const agregarInventario = (e) => {
                e.preventDefault();
                const form = e.target;
                const nuevoItem = {
                    id: Date.now(),
                    nombre: form.nombre.value,
                    precioBs: parseFloat(form.precio.value),
                    cantidad: parseInt(form.cantidad.value)
                };
                setInventario([...inventario, nuevoItem]);
                setModalAbierto(false);
                mostrarAlerta('Producto agregado al inventario');
            };

            const agregarDeuda = (e, tipo) => {
                e.preventDefault();
                const form = e.target;
                const nueva = {
                    id: Date.now(),
                    nombre: form.nombre.value,
                    detalle: form.detalle.value,
                    montoBs: parseFloat(form.monto.value),
                    fecha: obtenerFechaHora(),
                    tachado: false
                };
                if (tipo === 'nosdeben') setNosDeben([nueva, ...nosDeben]);
                else setDebemos([nueva, ...debemos]);
                setModalAbierto(false);
                mostrarAlerta('Registro agregado exitosamente');
            };

            const toggleDeuda = (id, tipo) => {
                if (tipo === 'nosdeben') {
                    setNosDeben(nosDeben.map(d => d.id === id ? { ...d, tachado: !d.tachado } : d));
                } else {
                    setDebemos(debemos.map(d => d.id === id ? { ...d, tachado: !d.tachado } : d));
                }
            };

            const eliminarDeuda = (id, tipo) => {
                confirmarAccion('¿Estás seguro de eliminar este registro permanentemente?', () => {
                    if (tipo === 'nosdeben') setNosDeben(nosDeben.filter(d => d.id !== id));
                    else setDebemos(debemos.filter(d => d.id !== id));
                    setConfirmDialog({ isOpen: false });
                    mostrarAlerta('Registro eliminado');
                });
            };

            const agregarPrecioRapido = (e) => {
                e.preventDefault();
                const form = e.target;
                const nuevo = {
                    id: Date.now(),
                    nombre: form.nombre.value,
                    precioBs: parseFloat(form.precio.value)
                };
                setPreciosRapidos([...preciosRapidos, nuevo]);
                form.reset();
            };

            const eliminarPrecioRapido = (id) => {
                setPreciosRapidos(preciosRapidos.filter(pr => pr.id !== id));
            };

            const renderVentas = () => {
                const ventasDelDia = ventas.filter(v => v.fechaCorta === fechaFiltro);
                const totalBs = ventasDelDia.reduce((acc, curr) => acc + curr.precioBs, 0);
                const totalDol = (totalBs / tasaDolar).toFixed(2);

                return (
                    <div className="p-4 fade-in-up">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-xl font-bold text-gray-800">Caja y Ventas</h2>
                            <input type="date" value={fechaFiltro} onChange={(e) => setFechaFiltro(e.target.value)} className="p-2 border border-gray-200 rounded-lg shadow-sm text-sm outline-none focus:ring-2 focus:ring-blue-400" />
                        </div>
                        
                        <div className="flex gap-4 mb-6">
                            <div className="flex-1 bg-gradient-to-br from-green-500 to-green-600 text-white p-4 rounded-2xl shadow-lg transform transition hover:scale-105">
                                <p className="text-xs opacity-90 mb-1 font-medium">Total Ingresos Bs</p>
                                <p className="text-2xl font-black">Bs {totalBs.toFixed(2)}</p>
                            </div>
                            <div className="flex-1 bg-gradient-to-br from-gray-700 to-gray-900 text-white p-4 rounded-2xl shadow-lg transform transition hover:scale-105">
                                <p className="text-xs opacity-90 mb-1 font-medium">Equivalente $</p>
                                <p className="text-2xl font-black">${totalDol}</p>
                            </div>
                        </div>

                        <div className="mb-6">
                            <div className="flex justify-between items-center mb-3">
                                <p className="text-xs text-gray-500 font-bold uppercase tracking-wider">Venta Rápida</p>
                                <button onClick={() => setModalAbierto('config_rapidas')} className="text-blue-500 hover:text-blue-700 text-xs font-bold bg-blue-50 hover:bg-blue-100 px-3 py-1 rounded-lg transition-colors"><i className="fas fa-pen mr-1"></i>Editar</button>
                            </div>
                            <div className="flex gap-3 overflow-x-auto hide-scrollbar pb-2">
                                {preciosRapidos.map(pr => (
                                    <button key={pr.id} onClick={() => procesarVenta(pr.nombre, pr.precioBs)} className="bg-blue-50 text-blue-800 px-4 py-3 rounded-xl whitespace-nowrap shadow-sm border border-blue-200 hover:bg-blue-100 active:scale-95 transition-all">
                                        <i className="fas fa-bolt mr-2 text-yellow-500"></i>
                                        <span className="font-bold">{pr.nombre}</span>
                                        <span className="ml-2 bg-white px-2 py-1 rounded text-xs shadow-sm font-semibold">{pr.precioBs} Bs</span>
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="mb-4">
                            <p className="text-xs text-gray-500 font-bold uppercase tracking-wider mb-3">Historial del Día</p>
                            {ventasDelDia.length === 0 ? (
                                <p className="text-center py-10 text-gray-400 bg-white rounded-2xl border border-dashed border-gray-300">No hay ventas registradas hoy.</p>
                            ) : (
                                <div className="space-y-3">
                                    {ventasDelDia.map(v => (
                                        <div key={v.id} className="bg-white p-4 rounded-xl shadow-sm border-l-4 border-green-500 flex justify-between items-center hover:shadow-md transition-shadow">
                                            <div>
                                                <p className="font-bold text-gray-800">{v.nombre}</p>
                                                <p className="text-xs text-gray-400"><i className="far fa-clock mr-1"></i>{v.fechaHora}</p>
                                            </div>
                                            <div className="text-right flex items-center gap-3">
                                                <p className="font-bold text-green-600 bg-green-50 px-2 py-1 rounded-lg">+{v.precioBs} Bs</p>
                                                <button onClick={() => eliminarVenta(v)} className="text-red-300 hover:text-red-500 p-2 rounded-full hover:bg-red-50 transition-colors"><i className="fas fa-trash-alt"></i></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                        
                        <button onClick={() => setModalAbierto('venta')} className="fixed bottom-24 right-6 bg-blue-600 text-white w-14 h-14 rounded-full shadow-[0_4px_15px_rgba(37,99,235,0.4)] flex items-center justify-center text-2xl z-40 transition-transform hover:scale-110 active:scale-95">
                            <i className="fas fa-plus"></i>
                        </button>
                    </div>
                );
            };

            const renderInventario = () => (
                <div className="p-4 fade-in-up">
                    <h2 className="text-xl font-bold mb-4 text-gray-800">Inventario y Stock</h2>
                    {inventario.length === 0 ? (
                        <p className="text-center text-gray-400 py-10 bg-white rounded-2xl border border-dashed border-gray-300">Inventario vacío. Añade productos.</p>
                    ) : (
                        <div className="space-y-3">
                            {inventario.map(item => (
                                <div key={item.id} className="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500 flex justify-between items-center hover:shadow-md transition-shadow">
                                    <div>
                                        <p className="font-bold text-gray-800 text-lg">{item.nombre}</p>
                                        <p className="text-sm text-gray-500 mt-1">Precio: <span className="font-semibold text-gray-700">{item.precioBs} Bs</span></p>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <div className="text-center bg-blue-50 px-3 py-1 rounded-lg border border-blue-100">
                                            <p className="text-xs text-blue-600 font-bold uppercase">Stock</p>
                                            <p className={`font-black text-lg ${item.cantidad <= 5 ? 'text-red-500' : 'text-blue-800'}`}>{item.cantidad}</p>
                                        </div>
                                        <button onClick={() => setModalAbierto({ tipo: 'vender_inventario', producto: item })} className="text-white bg-green-500 hover:bg-green-600 w-10 h-10 rounded-full shadow flex items-center justify-center transition-transform active:scale-90">
                                            <i className="fas fa-shopping-cart"></i>
                                        </button>
                                        <button onClick={() => {
                                            confirmarAccion(`¿Eliminar "${item.nombre}" del inventario?`, () => {
                                                setInventario(inventario.filter(i => i.id !== item.id));
                                                setConfirmDialog({isOpen: false});
                                                mostrarAlerta('Producto eliminado');
                                            });
                                        }} className="text-red-300 hover:text-red-500 p-2"><i className="fas fa-trash-alt"></i></button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                    <button onClick={() => setModalAbierto('inventario')} className="fixed bottom-24 right-6 bg-blue-600 text-white w-14 h-14 rounded-full shadow-[0_4px_15px_rgba(37,99,235,0.4)] flex items-center justify-center text-2xl z-40 transition-transform hover:scale-110 active:scale-95">
                        <i className="fas fa-plus"></i>
                    </button>
                </div>
            );

            const renderDeudas = (tipo) => {
                const isDebemos = tipo === 'debemos';
                const lista = isDebemos ? debemos : nosDeben;
                const pendientes = lista.filter(d => !d.tachado);
                const completados = lista.filter(d => d.tachado);
                const total = pendientes.reduce((acc, d) => acc + d.montoBs, 0);
                
                return (
                    <div className="p-4 fade-in-up">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-xl font-bold text-gray-800 flex items-center">
                                <div className={`w-8 h-8 rounded-full flex items-center justify-center mr-2 ${isDebemos ? 'bg-red-100 text-red-500' : 'bg-emerald-100 text-emerald-500'}`}>
                                    <i className={`fas ${isDebemos ? 'fa-arrow-up' : 'fa-arrow-down'}`}></i>
                                </div>
                                {isDebemos ? 'Cuentas por Pagar' : 'Cuentas por Cobrar'}
                            </h2>
                        </div>

                        <div className={`p-5 rounded-2xl mb-6 shadow-sm border flex justify-between items-center ${isDebemos ? 'bg-gradient-to-r from-red-50 to-red-100 border-red-200' : 'bg-gradient-to-r from-emerald-50 to-emerald-100 border-emerald-200'}`}>
                            <div>
                                <p className={`text-xs font-bold uppercase tracking-wider mb-1 ${isDebemos ? 'text-red-800' : 'text-emerald-800'}`}>Total Pendiente</p>
                                <p className={`text-3xl font-black ${isDebemos ? 'text-red-600' : 'text-emerald-600'}`}>{total.toFixed(2)} Bs</p>
                            </div>
                            <div className={`text-right font-medium bg-white/60 px-3 py-2 rounded-xl backdrop-blur-sm ${isDebemos ? 'text-red-700' : 'text-emerald-700'}`}>
                                <p className="text-xs uppercase mb-1">En Dólares</p>
                                <p className="font-bold">~ {(total / tasaDolar).toFixed(2)} $</p>
                            </div>
                        </div>

                        {lista.length === 0 ? (
                            <p className="text-center py-10 text-gray-400 bg-white rounded-2xl border border-dashed border-gray-300">No hay registros pendientes.</p>
                        ) : (
                            <div>
                                <h3 className="text-sm font-bold text-gray-500 mb-3 uppercase tracking-wide">Pendientes</h3>
                                {pendientes.length === 0 && <p className="text-center text-sm text-gray-400 mb-4 bg-white py-4 rounded-xl border border-gray-100">Sin deudas pendientes</p>}
                                <div className="space-y-3 mb-6">
                                    {pendientes.map(d => (
                                        <div key={d.id} className={`bg-white p-4 rounded-xl shadow-sm border-l-4 flex items-center justify-between transition-all duration-300 hover:shadow-md ${isDebemos ? 'border-red-400' : 'border-emerald-400'}`}>
                                            <div className="flex items-start gap-3 flex-1 overflow-hidden">
                                                <input type="checkbox" checked={d.tachado} onChange={() => toggleDeuda(d.id, tipo)} className={`w-6 h-6 mt-1 rounded border-gray-300 cursor-pointer accent-${isDebemos ? 'red' : 'emerald'}-500`} />
                                                <div className="flex-1 min-w-0">
                                                    <p className="font-bold text-gray-800 truncate text-lg">{d.nombre}</p>
                                                    <p className="text-sm text-gray-600 truncate">{d.detalle}</p>
                                                    <p className="text-xs text-gray-400 mt-1"><i className="far fa-calendar-alt mr-1"></i>{d.fecha}</p>
                                                </div>
                                            </div>
                                            <div className="flex flex-col items-end ml-2 pl-3 border-l border-gray-100">
                                                <p className={`font-black text-lg whitespace-nowrap ${isDebemos ? 'text-red-600' : 'text-emerald-600'}`}>{d.montoBs} Bs</p>
                                                <p className="text-xs font-semibold whitespace-nowrap mt-1 bg-gray-100 px-2 py-1 rounded text-gray-500">~ {(d.montoBs / tasaDolar).toFixed(2)} $</p>
                                                <button onClick={() => eliminarDeuda(d.id, tipo)} className="mt-2 text-gray-300 hover:text-red-500 p-1 transition-colors"><i className="fas fa-trash-alt"></i></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {completados.length > 0 && (
                                    <>
                                        <h3 className="text-sm font-bold text-gray-500 mb-3 uppercase tracking-wide flex items-center gap-2"><i className="fas fa-history"></i> Historial (Pagados)</h3>
                                        <div className="space-y-3 opacity-70">
                                            {completados.map(d => (
                                                <div key={d.id} className="bg-gray-50 p-4 rounded-xl border border-gray-200 flex items-center justify-between">
                                                    <div className="flex items-start gap-3 flex-1 overflow-hidden">
                                                        <input type="checkbox" checked={d.tachado} onChange={() => toggleDeuda(d.id, tipo)} className="w-6 h-6 mt-1 rounded border-gray-300 cursor-pointer accent-gray-500" />
                                                        <div className="flex-1 min-w-0">
                                                            <p className="font-bold text-gray-500 truncate text-lg line-through">{d.nombre}</p>
                                                            <p className="text-sm text-gray-400 truncate line-through">{d.detalle}</p>
                                                            <p className="text-xs text-gray-400 mt-1 line-through"><i className="far fa-calendar-alt mr-1"></i>{d.fecha}</p>
                                                        </div>
                                                    </div>
                                                    <div className="flex flex-col items-end ml-2 pl-3 border-l border-gray-200">
                                                        <p className="font-black text-lg whitespace-nowrap text-gray-400 line-through">{d.montoBs} Bs</p>
                                                        <button onClick={() => eliminarDeuda(d.id, tipo)} className="mt-2 text-gray-400 hover:text-red-500 p-1 transition-colors"><i className="fas fa-trash-alt"></i></button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </>
                                )}
                            </div>
                        )}

                        <button onClick={() => setModalAbierto(isDebemos ? 'deuda_debemos' : 'deuda_nosdeben')} className={`fixed bottom-24 right-6 text-white w-14 h-14 rounded-full shadow-[0_4px_15px_rgba(0,0,0,0.2)] flex items-center justify-center text-2xl z-40 transition-transform hover:scale-110 active:scale-95 ${isDebemos ? 'bg-red-500 hover:bg-red-600' : 'bg-emerald-500 hover:bg-emerald-600'}`}>
                            <i className="fas fa-plus"></i>
                        </button>
                    </div>
                );
            };

            const renderProfit = () => {
                const year = fechaCalendario.getFullYear();
                const month = fechaCalendario.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const firstDay = new Date(year, month, 1).getDay(); // 0 = Domingo
                
                const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                const monthNombre = meses[month];

                // Agrupar ventas por día
                const dailyProfits = {};
                let totalMesBs = 0;

                ventas.forEach(v => {
                    if (v.fechaCorta && v.fechaCorta.startsWith(`${year}-${String(month + 1).padStart(2, '0')}`)) {
                        dailyProfits[v.fechaCorta] = (dailyProfits[v.fechaCorta] || 0) + v.precioBs;
                        totalMesBs += v.precioBs;
                    }
                });

                // Calcular el día con más ventas para el mapa de calor (intensidad)
                const maxProfit = Math.max(0, ...Object.values(dailyProfits));

                // Lógica de colores estilo Axiom/Github
                const getColorClass = (monto) => {
                    if (!monto || monto === 0) return 'bg-gray-50 border-gray-100 text-gray-400';
                    const ratio = monto / maxProfit;
                    if (ratio <= 0.25) return 'bg-emerald-200 text-emerald-800 border-emerald-300';
                    if (ratio <= 0.50) return 'bg-emerald-300 text-emerald-900 border-emerald-400';
                    if (ratio <= 0.75) return 'bg-emerald-400 text-white border-emerald-500 shadow-sm';
                    return 'bg-emerald-500 text-white border-emerald-600 shadow-md';
                };

                const diasSemana = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
                const daysArray = Array(firstDay).fill(null);
                for (let i = 1; i <= daysInMonth; i++) daysArray.push(i);

                return (
                    <div className="p-4 fade-in-up pb-24">
                        {/* Control de Mes */}
                        <div className="flex justify-between items-center mb-6 bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
                            <button onClick={() => setFechaCalendario(new Date(year, month - 1, 1))} className="w-10 h-10 rounded-full bg-gray-50 hover:bg-gray-100 flex items-center justify-center text-gray-600 transition-colors"><i className="fas fa-chevron-left"></i></button>
                            <h2 className="text-lg font-black text-gray-800 capitalize">{monthNombre} {year}</h2>
                            <button onClick={() => setFechaCalendario(new Date(year, month + 1, 1))} className="w-10 h-10 rounded-full bg-gray-50 hover:bg-gray-100 flex items-center justify-center text-gray-600 transition-colors"><i className="fas fa-chevron-right"></i></button>
                        </div>

                        {/* Tarjeta de Resumen */}
                        <div className="bg-gradient-to-br from-indigo-600 to-blue-700 p-6 rounded-3xl mb-6 shadow-lg text-white transform transition-all hover:scale-[1.02]">

                theme_color: "#1e3a8a",
                icons: [{
                    src: "https://cdn-icons-png.flaticon.com/512/3105/3105807.png", // Icono de gota de agua
                    sizes: "512x512",
                    type: "image/png",
                    purpose: "any maskable"
                }]
            };
            
            const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            const manifestUrl = URL.createObjectURL(manifestBlob);
            
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestUrl;
            document.head.appendChild(link);

            // 2. Registrar Service Worker Básico (para que funcione offline / instalable)
            if ('serviceWorker' in navigator) {
                const swCode = `
                    self.addEventListener('install', (e) => self.skipWaiting());
                    self.addEventListener('activate', (e) => self.clients.claim());
                    self.addEventListener('fetch', (e) => {
                        // Un Service worker básico de "pasa todo" (fetch pass-through)
                    });
                `;
                const swBlob = new Blob([swCode], {type: 'application/javascript'});
                const swUrl = URL.createObjectURL(swBlob);
                
                navigator.serviceWorker.register(swUrl)
                    .then(reg => console.log('PWA Lista! Service Worker registrado.', reg))
                    .catch(err => console.error('Error registrando Service Worker:', err));
            }
        });
    </script>
</body>
</html>
